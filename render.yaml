services:
  - type: web
    name: tilshunos-api-4dj7
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace @tilshunos/api
    startCommand: npm run start --workspace @tilshunos/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Tilshunos
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WEB_ORIGIN
        value: https://tilshunos-web-4dj7.onrender.com

  - type: web
    name: tilshunos-web-4dj7
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace @tilshunos/web
    startCommand: npm run start --workspace @tilshunos/web
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_PUBLIC_API_URL
        value: https://tilshunos-api-4dj7.onrender.com/api
      - key: NEXT_PUBLIC_TELEGRAM_BOT_NAME
        value: Authlogin1122bot
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
